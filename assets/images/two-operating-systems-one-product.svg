<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Two operating systems, one product</title>
  <desc id="desc">Active-Edge graphic showing Android 16 and Foundries Linux joined as one maintained product stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.7" stop-color="#0B1730"/>
      <stop offset="1" stop-color="#161A43"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20D6D2"/>
      <stop offset="1" stop-color="#7557FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1050" cy="80" r="210" fill="#7557FF" opacity="0.11" filter="url(#glow)"/>
  <circle cx="780" cy="620" r="260" fill="#20D6D2" opacity="0.09" filter="url(#glow)"/>

  <g opacity="0.22" fill="none" stroke="#8FA4BF" stroke-width="1">
    <path d="M0 110H210L250 150H395"/>
    <path d="M0 545H170L220 495H390"/>
    <path d="M830 0V58L875 103H1200"/>
    <path d="M910 627V570L955 525H1200"/>
  </g>

  <g transform="translate(70 60)">
    <g transform="translate(0 2)">
      <path d="M0 20 22 0l22 20-22 20z" fill="none" stroke="#20D6D2" stroke-width="4"/>
      <path d="M6 20 22 6l16 14-16 14z" fill="#7557FF"/>
    </g>
    <text x="62" y="25" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">ACTIVE-EDGE</text>
    <text x="62" y="48" fill="#8FA4BF" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15">EMBEDDED INTELLIGENCE. MADE REAL.</text>
  </g>

  <g transform="translate(70 190)">
    <text fill="#20D6D2" font-family="Space Grotesk, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="3">INSIGHTS</text>
    <text y="74" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="58" font-weight="800">Two operating</text>
    <text y="139" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="58" font-weight="800">systems,</text>
    <text y="204" fill="#F7F9FC" font-family="Sora, Arial, sans-serif" font-size="58" font-weight="800">one product</text>
    <text y="258" fill="#B9C6D8" font-family="IBM Plex Sans, Arial, sans-serif" font-size="21">Android 16 · embedded Linux · secure updates</text>
  </g>

  <g transform="translate(760 140)">
    <rect x="0" y="0" width="355" height="350" rx="28" fill="#07111F" stroke="url(#edge)" stroke-width="3"/>
    <rect x="22" y="22" width="311" height="306" rx="16" fill="#0E1A2B" stroke="#28405B"/>

    <rect x="48" y="50" width="259" height="92" rx="12" fill="#111F35" stroke="#7557FF" stroke-width="2"/>
    <circle cx="75" cy="78" r="7" fill="#7557FF"/>
    <text x="94" y="84" fill="#F7F9FC" font-family="Space Grotesk, Arial, sans-serif" font-size="20" font-weight="500">ANDROID 16</text>
    <text x="75" y="116" fill="#AEBBD0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="16">LINEAGEOS 23.2</text>

    <path d="M177 143V174" stroke="#20D6D2" stroke-width="3"/>
    <circle cx="177" cy="159" r="6" fill="#20D6D2"/>

    <rect x="48" y="174" width="259" height="42" rx="10" fill="#12323C" stroke="#20D6D2"/>
    <text x="177" y="201" text-anchor="middle" fill="#20D6D2" font-family="Space Grotesk, Arial, sans-serif" font-size="16" font-weight="500">WAYDROID</text>

    <path d="M177 216V247" stroke="#20D6D2" stroke-width="3"/>
    <circle cx="177" cy="232" r="6" fill="#20D6D2"/>

    <rect x="48" y="247" width="259" height="58" rx="12" fill="#111F35" stroke="#20D6D2" stroke-width="2"/>
    <text x="75" y="276" fill="#F7F9FC" font-family="Space Grotesk, Arial, sans-serif" font-size="19" font-weight="500">FOUNDRIES LINUX</text>
    <text x="75" y="296" fill="#AEBBD0" font-family="IBM Plex Sans, Arial, sans-serif" font-size="13">BOARD · BOOT · OTA · RECOVERY</text>
  </g>

  <g transform="translate(790 514)">
    <circle cx="10" cy="10" r="10" fill="#B6F23B"/>
    <path d="m5 10 3 3 7-7" fill="none" stroke="#07111F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="32" y="16" fill="#D9E2EF" font-family="IBM Plex Sans, Arial, sans-serif" font-size="17">Built → staged → booted → working</text>
  </g>
</svg>
